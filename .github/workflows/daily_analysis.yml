name: 每日股票分析

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      AGENT_SKILLS: ${{ secrets.AGENT_SKILLS }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      EFINANCE_PRIORITY: 99
      AKSHARE_PRIORITY: 99

    steps:
      - name: 检出代码（pro分支）
        uses: actions/checkout@v4
        with:
          ref: pro

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install tushare pandas

      - name: 创建必要目录
        run: mkdir -p logs reports

      - name: 🔍 第一步：双名单自动筛选
        run: |
          echo "================================================"
          echo "🚀 开始全市场双名单综合筛选..."
          echo "================================================"
          timeout 300 python auto_screener.py || echo "⚠️ 筛选超时或出错"
          echo "筛选结果："
          cat screened_stocks.txt 2>/dev/null || echo "（无结果）"

      - name: 📊 第二步：七因子深度分析
        run: |
          echo "================================================"
          echo "🔬 开始深度分析..."
          echo "================================================"
          if [ -f screened_stocks.txt ] && [ -s screened_stocks.txt ]; then
            STOCKS=$(cat screened_stocks.txt)
            echo "✅ 读取到股票列表: $STOCKS"
            timeout 1800 python main.py --stocks "$STOCKS" || echo "⚠️ 分析超时，已强制结束"
          else
            echo "⚠️ 无筛选结果，仅输出大盘复盘"
            timeout 1800 python main.py --market-review || echo "⚠️ 超时"
          fi

      - name: 上传分析报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
            screened_stocks.txt
          retention-days: 7

      - name: 显示运行结果
        if: always()
        run: |
          echo "================================================"
          echo "📊 本次运行完成"
          echo "================================================"
          echo "筛选出的股票："
          cat screened_stocks.txt 2>/dev/null || echo "无筛选结果"
          echo ""
          echo "生成的报告："
          ls -la reports/ 2>/dev/null || echo "暂无报告"
          echo ""
          echo "最近日志（最后20行）："
          tail -20 logs/stock_analysis_$(date +%Y%m%d).log 2>/dev/null || echo "无日志"
