name: 每日股票分析

on:
  schedule:
    - cron: '0 10 * * 1-5'  # 北京时间18:00（UTC+8），周一到周五
  workflow_dispatch:
    inputs:
      branch:
        description: '运行分支'
        required: false
        default: 'pro'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # AI模型
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 数据源
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      # 策略
      AGENT_SKILLS: ${{ secrets.AGENT_SKILLS }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}

      # 备用股票列表（筛选失败时使用）
      STOCK_LIST: ${{ secrets.STOCK_LIST }}

    steps:
      - name: 检出代码（pro分支）
        uses: actions/checkout@v4
        with:
          ref: pro

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install akshare pandas

      - name: 创建必要目录
        run: mkdir -p logs reports

      - name: 🔍 第一步：双名单自动筛选（涨停+主力流入）
        run: |
          echo "================================================"
          echo "🚀 开始全市场双名单综合筛选..."
          echo "================================================"

          # 运行筛选脚本
          python auto_screener.py

          # 读取筛选结果
          if [ -f screened_stocks.txt ] && [ -s screened_stocks.txt ]; then
            SCREENED=$(cat screened_stocks.txt)
            echo "✅ 筛选成功: $SCREENED"
            echo "STOCK_LIST=$SCREENED" >> $GITHUB_ENV
          else
            echo "⚠️ 筛选结果为空，使用备用列表"
            echo "STOCK_LIST=${{ secrets.STOCK_LIST }}" >> $GITHUB_ENV
          fi

      - name: 📊 第二步：七因子深度分析
        run: |
          echo "================================================"
          echo "🔬 开始对候选股票深度分析..."
          echo "股票列表: $STOCK_LIST"
          echo "================================================"

          if [ -z "$STOCK_LIST" ]; then
            echo "⚠️ 股票列表为空，跳过分析"
            exit 0
          fi

          python main.py --stocks "$STOCK_LIST"

      - name: 上传分析报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
            screened_stocks.txt
          retention-days: 7

      - name: 显示运行结果
        if: always()
        run: |
          echo ""
          echo "================================================"
          echo "📊 本次运行完成"
          echo "================================================"
          echo "筛选出的股票："
          cat screened_stocks.txt 2>/dev/null || echo "无筛选结果"
          echo ""
          echo "生成的报告："
          ls -la reports/ 2>/dev/null || echo "暂无报告"
          echo ""
          echo "最近日志（最后20行）："
          tail -20 logs/stock_analysis_$(date +%Y%m%d).log 2>/dev/null || echo "无日志"
