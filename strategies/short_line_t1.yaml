name: short_line_t1
display_name: A股T+1短线套利（七因子）
description: >
  专为A股T+1短线套利设计的七因子量化策略。
  综合涨停质量、连板动量、资金流向、情绪竞价、
  题材板块、流动性和技术形态七个维度打分，
  筛选次日溢价概率最高的短线标的。

version: "1.0"
market: cn
style: short_term

scoring:
  weights:
    limit_up_quality: 0.22
    momentum: 0.18
    capital_flow: 0.20
    sentiment: 0.15
    theme: 0.12
    liquidity: 0.08
    technical: 0.05

rules:
  - name: 涨停质量评估
    factor: limit_up_quality
    description: >
      评估今日涨停的质量。
      一字板（开盘即涨停封死）= 最高分；
      早盘10:30前封板 = 高分；
      换手板（打开后重新封回）= 中高分；
      尾盘封板 = 低分；
      炸板次数越多扣分越多，炸板2次及以上直接淘汰。

  - name: 连板动量评估
    factor: momentum
    description: >
      连续涨停天数越多得分越高。
      首板=基础分，2板=中高分，3板=高分，4板及以上=最高分。
      必须是板块内率先涨停的龙头股，跟风股减半，
      孤立涨停（无板块联动）不得分。
      注意：连板超过7板属于高风险区域，直接淘汰。

  - name: 主力资金流向
    factor: capital_flow
    description: >
      当日主力大单净流入占总成交额比例越高越好。
      超过30%为满分，15%-30%为中分，低于15%为低分。
      龙虎榜有机构席位买入额外加分，知名游资席位加分，无席位不加分。
      北向资金（陆股通）当日净买入该股或所属板块额外加分，净卖出扣分。

  - name: 情绪竞价信号
    factor: sentiment
    description: >
      集合竞价阶段（9:15-9:25）的活跃程度是预测次日溢价最有效的指标。
      竞价成交额占昨日全天成交额比例（竞昨比）超过10%为满分。
      封单金额占当日总成交额比例（封成比）越高越好。
      竞价阶段已高开说明资金提前布局，共识强，额外加分。

  - name: 题材板块热度
    factor: theme
    description: >
      所属板块当日涨停数量排行前3为满分，前10为中分，其他为低分。
      题材启动第1-3个交易日为最佳介入窗口，得满分；
      第4-5日得中分；超过7日题材过热，得0分。
      有明确政策利好或业绩预告催化额外加分。

  - name: 流动性评估
    factor: liquidity
    description: >
      自由流通市值20亿-50亿的情绪小票弹性最大，得满分；
      50亿-200亿得中分；超过200亿大盘股短线弹性差，得低分；
      低于10亿微盘股流动性风险大，直接淘汰。
      换手率5%-15%为最优区间，过高或过低均扣分。
      日均成交额须超过3亿，保证次日能正常卖出。

  - name: 技术形态
    factor: technical
    description: >
      5日、10日、20日均线多头排列（短期均线在长期均线上方）加分；
      量比大于2（放量涨停）加分；
      KDJ指标金叉或从超卖区反弹加分。

filters:
  exclude:
    - ST股和*ST股：财务风险高，直接排除
    - 自由流通市值低于10亿：微盘股流动性差
    - 当日炸板次数大于等于2次：多空分歧严重
    - 近3个交易日有大股东减持公告：主力离场信号
    - 连板天数超过7板：高位风险极大，普通投资者不参与
    - 市场处于退潮期（炸板率超50%且涨停少于30家）：整体环境差

output:
  grades:
    S: "综合评分90分以上，强烈推荐，龙头地位明确"
    A: "综合评分75-89分，推荐，多因子共振"
    B: "综合评分60-74分，观察，逻辑成立但确定性一般"
    C: "综合评分60分以下，跳过不输出"

  required_fields:
    - 综合评分（满分100分）
    - 七因子各项得分明细
    - 今日涨停类型和封板时间
    - 主力资金净流入金额和占比
    - 明日建议买入价区间
    - 止盈目标（保守+激进）
    - 止损价格（买入价×95%）
    - 核心买入逻辑（1-2句话）
    - 具体风险提示

  trading_rules:
    entry: >
      T+1规则下，今日涨停股明日开盘为买入时机。
      集合竞价高开2%-5%以内可参与；
      高开超过5%不追，成本太高；
      平开观察5分钟看方向；
      低开超过3%放弃，等下一个机会。
    exit: >
      明日开盘高开3%以上直接卖出锁定利润；
      高开后持续上攻可持有博连板，但先卖出一半；
      高开低走（冲高回落）立刻卖出；
      跌破止损价（买入价×95%）无条件止损。
    position: >
      单只股票不超过总资金25%；
      同时持有不超过4只；
      始终保留30%资金不动用于应急。
